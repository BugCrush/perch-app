<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Perch README 3D</title>
<style>
  @font-face { font-family: Caveat; font-weight: 700; src: url(../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Caveat; font-weight: 500; src: url(../node_modules/@fontsource/caveat/files/caveat-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Newsreader; font-weight: 500; src: url(../node_modules/@fontsource/newsreader/files/newsreader-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Manrope; font-weight: 500; src: url(../node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Manrope; font-weight: 700; src: url(../node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; padding: 0; background: transparent; }
  #card { position: relative; overflow: hidden; }
  #card > * { position: absolute; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "roughjs": "../node_modules/roughjs/bundled/rough.esm.js"
} }
</script>
</head>
<body>
<div id="card"></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const mod = await import(`./scenes/${q.get('scene')}.js`);
  try {
    const api = await mod.build(document.getElementById('card'), q);
    window.__frames = api.frames;
    window.__frame = (i) => api.frame(i);
    window.__meta = { cell: api.cell, names: api.names, cols: api.cols };
    window.__ready = true;
  } catch (e) {
    window.__error = String(e.stack || e);
  }
</script>
</body>
</html>
